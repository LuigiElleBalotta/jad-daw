name: release

# Builds the Windows exe and the macOS app and publishes them as a GitHub release, only for version tags that sit on main:
#   0.0.x            alpha        (GitHub pre-release)
#   0.y.z, y >= 1    beta         (GitHub pre-release)
#   x.y.z-N          pre-release  (GitHub pre-release)
#   x.y.z, x >= 1    release
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tagged commit must be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not on main: releases are only built from main"
            exit 1
          fi
      - name: Channel from the version
        id: v
        run: |
          v="$GITHUB_REF_NAME"
          if   [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then channel="pre-release"; pre=true
          elif [[ "$v" =~ ^0\.0\.[0-9]+$ ]];                         then channel="alpha";       pre=true
          elif [[ "$v" =~ ^0\.[0-9]+\.[0-9]+$ ]];                    then channel="beta";        pre=true
          elif [[ "$v" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]];          then channel="release";     pre=false
          else echo "::error::unexpected version $v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "$v is $channel"

  build:
    needs: meta
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            configure: -A x64 -T host=x64
          - os: macos-15   # Qt 6.8 links AGL, missing from the macOS 26 SDK that macos-latest now has
            name: macos-arm64
            configure: -DCMAKE_BUILD_TYPE=Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}   # empty without the secret: the signing steps are skipped
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          modules: qtshadertools qtmultimedia
          cache: true
      - name: Configure
        run: cmake -S . -B build ${{ matrix.configure }} -DLPC_BUILD_UI=ON -DJAD_VERSION=${{ needs.meta.outputs.version }}
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      # Windows code signing through SignPath (docs/signing.md). Every signing step runs only when the secret SIGNPATH_API_TOKEN exists:
      # without it the release is built unsigned, as before.
      - name: Collect the programs to sign (Windows)
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path unsigned-exe | Out-Null
          Copy-Item build/ui/Release/jad-daw.exe, build/ui/Release/lpc-plugin-scanner.exe unsigned-exe/
      - name: Upload the programs to sign (Windows)
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        id: upload-exe
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: unsigned-exe/*
      - name: Sign the programs (SignPath)
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          # the zip (portable) and the setup (installs for the current user; the updater of the program runs it) from the deployed build folder;
          # signed-exe (when SignPath ran) replaces the two programs inside both
          $overlay = if (Test-Path signed-exe) { @("-Overlay", "signed-exe") } else { @() }
          ./installer/windows/build.ps1 -Version "${{ needs.meta.outputs.version }}" -Source build/ui/Release -Out dist-win @overlay
          Move-Item dist-win/* .
      - name: Upload the setup to sign (Windows)
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        id: upload-setup
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: jad-daw-*-setup.exe
      - name: Sign the setup (SignPath)
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup
      - name: Use the signed setup (Windows)
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: Move-Item signed-setup/*.exe . -Force
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app=build/ui/jad-daw.app
          "$QT_ROOT_DIR/bin/macdeployqt" "$app" -qmldir=ui/qml
          cp LICENSE THIRD_PARTY.md "$app/Contents/Resources/"
          # the zip is what the updater of the program downloads; the disk image is for the first install (drag the app onto Applications)
          ditto -c -k --sequesterRsrc --keepParent "$app" "jad-daw-${{ needs.meta.outputs.version }}-${{ matrix.name }}.zip"
          ./installer/macos/build-dmg.sh "$app" "${{ needs.meta.outputs.version }}" dist-mac
          mv dist-mac/*.dmg .
      - uses: actions/upload-artifact@v4
        with:
          name: jad-daw-${{ matrix.name }}
          path: |
            jad-daw-*.zip
            jad-daw-*-setup.exe
            jad-daw-*.dmg
          if-no-files-found: error

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
          CHANNEL: ${{ needs.meta.outputs.channel }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          flag=""
          if [ "$PRERELEASE" = "true" ]; then flag="--prerelease"; fi
          gh release create "$VERSION" dist/* $flag \
            --repo "$GITHUB_REPOSITORY" \
            --title "JAD Daw $VERSION ($CHANNEL)" \
            --notes "JAD Daw $VERSION, $CHANNEL build.

          - Windows: run \`jad-daw-$VERSION-windows-x64-setup.exe\` (installs for your user, no administrator needed), or unzip \`jad-daw-$VERSION-windows-x64.zip\` and run \`jad-daw.exe\`.
          - macOS (Apple Silicon): open \`jad-daw-$VERSION-macos-arm64.dmg\` and drag the app onto Applications, then right-click the app and choose Open the first time (the app is not signed yet).
          - Updates: Help > Check for Updates in the program installs a newer release over the installed copy (the program also looks once a day at start-up).
          - New since 0.0.1: Channel EQ (HQ mode, Mid/Side), Noise Gate side-chain filter, Drum Kit, Match EQ analyzer, live loudness and correlation meters in Mastering, CAF export, signature and key lists in the control bar. A screen-by-screen guide with pictures is in docs/user-guide.md.
          - 48 kHz audio device. This is early software: expect rough edges."
