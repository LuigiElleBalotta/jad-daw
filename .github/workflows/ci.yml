name: ci
on:
  push:
    branches: [main]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            configure: -A x64   # default generator = newest Visual Studio on the runner
          - os: macos-latest   # Apple Silicon: also covers weakly ordered memory and CoreAudio via JUCE
            configure: -DCMAKE_BUILD_TYPE=Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build ${{ matrix.configure }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
